<!doctype html>
<html lang="ar" dir="rtl">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta http-equiv="refresh" content="2; url=$(link-redirect)">
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="-1">
    <meta name="theme-color" content="#041f22" />
    <title>الخالد نت - تم تسجيل الدخول بنجاح</title>
    <link rel="stylesheet" href="css/modern-hotspot.css">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <script>
        function startClock() {
            $(if popup == 'true')
            try {
                open('$(link-status)', 'hotspot_status', 'toolbar=0,location=0,directories=0,status=0,menubars=0,resizable=1,width=290,height=200');
            } catch (e) {}
            $(endif)
            setTimeout(function() {
                location.href = unescape('$(link-redirect-esc)');
            }, 1000);
        }
    </script>
</head>

<body onLoad="startClock()">
    <!-- Ambient Background Glows -->
    <div class="bg-ambient bg-ambient-top"></div>
    <div class="bg-ambient bg-ambient-bottom"></div>

    <div class="main-wrapper" style="display: flex; flex-direction: column; justify-content: center; min-height: 80vh;">
        <div class="glass-card" style="text-align: center; padding: 35px 20px;">
            <div style="width: 65px; height: 65px; border-radius: 50%; background: rgba(0, 242, 195, 0.2); border: 2px solid var(--accent-cyan); display: flex; align-items: center; justify-content: center; font-size: 2rem; margin: 0 auto 16px; color: var(--accent-cyan);">
                ✓
            </div>
            <h2>تم تسجيل دخولك بنجاح!</h2>
            <p style="margin-top: 8px; font-size: 0.9rem; color: #cbd5e1;">جاري توجيهك إلى الإنترنت الآن...</p>

            <div style="margin-top: 24px;">
                <a href="$(link-redirect)" class="btn-submit">
                    <span>متابعة التصفح الآن</span>
                    <span>🌐</span>
                </a>
            </div>
            <div style="margin-top: 10px;">
                <a href="status.html" style="font-size: 0.85rem; color: var(--accent-cyan); text-decoration: underline;">
                    عرض شاشة الرصيد وحالة الاتصال
                </a>
            </div>
        </div>
    </div>
</body>

</html>
