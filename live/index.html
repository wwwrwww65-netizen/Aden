<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>ZeroLAG · منصة البث</title>
    <link rel="icon" href="img/logo.png" type="image/png">

</head>
<body>
    <div id="zl-root"></div>

    <script>
        window.__ZL_CDN__ = 'https://to.zerolag.live/public/402';

        window.__ZL_APP_READY__ = false;
        window.__ZL_BOOT__ = setTimeout(function () {
            if (!window.__ZL_APP_READY__) {
                var s = document.createElement('script');
                s.src = './fallback.js';
                document.head.appendChild(s);
            }
        }, 15000);

        (function loadBoot() {
            var cdn = window.__ZL_CDN__;
            var bootSrc = (cdn === 'local')
                ? './js/boot.js'
                : (String(cdn || 'https://to.zerolag.live/public/402').replace(/\/$/, '') + '/js/boot.js');

            var script = document.createElement('script');
            script.src = bootSrc;
            script.onerror = function () {
                clearTimeout(window.__ZL_BOOT__);
                var fb = document.createElement('script');
                fb.src = './fallback.js';
                document.head.appendChild(fb);
            };
            document.head.appendChild(script);
        })();
    </script>
</body>
</html>
